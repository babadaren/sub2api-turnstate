name: Release package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.2.0)
        required: true
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: npm run check && npm test
      - run: npm pack --ignore-scripts && sha256sum *.tgz > SHA256SUMS
      - name: Upload package to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" *.tgz SHA256SUMS
